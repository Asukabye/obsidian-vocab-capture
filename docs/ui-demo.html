<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>不理解词管理 · UI 示例</title>
<style>
  :root {
    --bg: #f4f3f0;
    --paper: #ffffff;
    --panel: #faf9f7;
    --line: #e6e2dc;
    --line-strong: #d8d3cc;
    --text: #2f2e2c;
    --muted: #77726c;
    --faint: #a39d95;
    --accent: #6c5ce7;
    --accent-soft: #f0edff;
    --danger: #b35366;
    --hover: #f2f0ed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 12px;
  }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  .app {
    width: 1180px;
    margin: 22px auto 34px;
    background: var(--paper);
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(32, 28, 22, .08);
  }
  .titlebar {
    display: flex;
    align-items: center;
    height: 36px;
    padding: 0 15px;
    border-bottom: 1px solid var(--line);
    background: #fbfaf8;
    color: var(--muted);
    font-size: 11px;
  }
  .filename { color: #5e5953; }
  .demo-label { margin-left: auto; color: var(--faint); font-size: 10px; }

  /* compact bar */
  .compact {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 46px;
    padding: 0 20px;
    border-bottom: 1px solid var(--line);
  }
  .compact-title { font-size: 13px; font-weight: 700; }
  .compact-meta { color: var(--faint); font-size: 10px; }
  .compact-actions { display: flex; gap: 6px; margin-left: auto; }
  .btn {
    height: 27px;
    padding: 0 9px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    color: #5f5a55;
    font-size: 11px;
  }
  .btn:hover { background: #f6f4f8; }
  .btn-primary { border-color: var(--accent); background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #5b4bd3; }
  .btn-quiet { border-color: transparent; background: transparent; }
  .btn:disabled { cursor: default; opacity: .45; }

  /* manager */
  .manager { margin: 12px 20px 0; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
  .manager[hidden] { display: none; }
  .manager-head {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    background: #fbfaf8;
  }
  .manager-title { font-size: 12px; font-weight: 700; }
  .manager-sub { color: var(--faint); font-size: 9px; }
  .search {
    width: 238px;
    height: 26px;
    margin-left: auto;
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    color: var(--text);
    font-size: 10px;
    outline: none;
  }
  .search::placeholder { color: #aca59d; }
  .search:focus { border-color: #bdb2e8; }
  .close-manager { border: 0; background: transparent; color: #8e8780; font-size: 10px; padding: 3px 2px; }
  .close-manager:hover { color: var(--text); }

  .manager-body { display: grid; grid-template-columns: 304px minmax(0, 1fr); min-height: 385px; }
  .left {
    border-right: 1px solid var(--line);
    padding: 9px 8px 8px 10px;
    background: #fbfaf8;
  }
  .section-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 6px; }
  .section-title { color: var(--faint); font-size: 9px; font-weight: 700; letter-spacing: .06em; }
  .section-add { border: 0; background: transparent; color: var(--accent); font-size: 9px; padding: 2px; }
  .tree { display: flex; flex-direction: column; gap: 1px; max-height: 318px; overflow: auto; }
  .tree-row {
    display: flex;
    align-items: center;
    gap: 5px;
    min-height: 27px;
    padding: 0 5px;
    border-radius: 4px;
    color: #5e5953;
    cursor: pointer;
    user-select: none;
  }
  .tree-row:hover { background: #f1efeb; }
  .tree-row.selected { background: var(--accent-soft); color: #5541b4; }
  .tree-row.parent-selected { background: #f4f1ec; }
  .tree-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-row.file .tree-name { color: inherit; }
  .tree-count { margin-left: auto; color: #a29b92; font-size: 9px; }
  .tree-row.selected .tree-count { color: #6f5bc0; }
  .tree-state { border: 0; background: transparent; color: #9c958c; font-size: 9px; padding: 1px 2px; }
  .tree-state:hover { color: var(--accent); }
  .tree-empty { padding: 2px 5px 4px 20px; color: #b0a9a0; font-size: 9px; }
  .tree-note { margin: 8px 4px 0; padding-top: 7px; border-top: 1px dashed var(--line); color: #aaa39a; font-size: 8px; line-height: 1.6; }

  .right { padding: 10px 13px 8px 14px; background: #fff; min-width: 0; }
  .breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 0 3px 4px; color: #9b949b; font-size: 9px; }
  .breadcrumb b { color: #4e4953; font-weight: 600; }
  .right-head { display: flex; align-items: baseline; gap: 8px; padding: 0 3px 7px; border-bottom: 1px solid var(--line); }
  .right-title { font-size: 12px; font-weight: 700; }
  .right-count { color: #a49da5; font-size: 9px; }
  .right-actions { display: flex; gap: 5px; margin-left: auto; }
  .right-actions .btn { height: 25px; font-size: 10px; }
  .right-hint { padding: 5px 3px 0; color: #a8a1a6; font-size: 8px; }
  .heading-tree { display: flex; flex-direction: column; gap: 2px; max-height: 275px; overflow: auto; padding-top: 4px; }
  .heading-row {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    padding: 6px 6px 6px 4px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  .heading-row:hover { background: #faf9fc; border-color: #e8e3ef; }
  .heading-row.selected { border-color: #cfc5e9; background: #fbfaff; }
  .level {
    flex: 0 0 23px;
    height: 17px;
    margin-top: 1px;
    border-radius: 3px;
    background: #f0edf3;
    color: #8d8590;
    font-size: 8px;
    font-weight: 600;
    line-height: 17px;
    text-align: center;
  }
  .level.h1 { background: #eeebff; color: #5e48ba; }
  .level.h2 { background: #f1f0f8; color: #756a91; }
  .level.h3 { background: #f3f1ee; color: #968d80; }
  .heading-main { min-width: 0; flex: 1; }
  .heading-line { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .heading-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #37333a; font-size: 11px; font-weight: 600; }
  .tag { padding: 0 4px; border-radius: 3px; background: #f3f1f7; color: #90879c; font-size: 8px; white-space: nowrap; }
  .heading-snippet { overflow: hidden; margin-top: 2px; color: #a09aa2; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
  .heading-state { border: 0; background: transparent; color: #9e97a3; font-size: 9px; padding: 1px 3px; }
  .heading-state:hover { color: var(--accent); }
  .empty-state { padding: 34px 12px; color: #a8a1a0; font-size: 10px; text-align: center; }
  .manager-foot { display: flex; gap: 10px; padding: 6px 12px; border-top: 1px solid var(--line); background: #fbfaf8; color: #a19a9f; font-size: 8px; }
  .foot-right { margin-left: auto; }

  /* context menu */
  .context-menu {
    position: fixed;
    z-index: 30;
    min-width: 158px;
    padding: 4px;
    border: 1px solid #ddd8d1;
    border-radius: 5px;
    background: #fff;
    box-shadow: 0 8px 22px rgba(35, 30, 22, .14);
    display: none;
  }
  .context-menu button {
    display: block;
    width: 100%;
    padding: 5px 8px;
    border: 0;
    border-radius: 3px;
    background: transparent;
    color: #4e4944;
    text-align: left;
    font-size: 10px;
  }
  .context-menu button:hover { background: #f1eef9; color: #4f3db0; }
  .context-menu button.danger:hover { background: #fbf0f2; color: var(--danger); }

  /* modal */
  .modal-layer { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(34, 29, 38, .22); }
  .modal-layer.open { display: flex; }
  .modal { width: 440px; max-width: calc(100vw - 30px); padding: 17px 18px 13px; border: 1px solid #e0dae8; border-radius: 7px; background: #fff; box-shadow: 0 14px 38px rgba(30, 24, 38, .18); }
  .modal-title { margin-bottom: 9px; color: #3c3744; font-size: 13px; font-weight: 700; }
  .modal-sub { margin-bottom: 10px; color: #938b98; font-size: 10px; line-height: 1.55; }
  .path-box { margin: 7px 0 10px; padding: 6px 8px; border-radius: 4px; background: #faf8ff; color: #6c5c91; font-size: 10px; line-height: 1.55; }
  .field { display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: center; gap: 8px; margin: 8px 0; }
  .field label { color: #8d8593; font-size: 10px; }
  .field input, .field select {
    width: 100%;
    height: 28px;
    padding: 0 7px;
    border: 1px solid #e0dae8;
    border-radius: 4px;
    background: #fff;
    color: #4b4552;
    font-size: 10px;
    outline: none;
  }
  .field input:focus, .field select:focus { border-color: #b9ace5; }
  .level-preview { display: inline-flex; align-items: center; gap: 5px; padding: 2px 6px; border-radius: 3px; background: #f1effb; color: #6652ad; font-size: 9px; }
  .level-preview b { font-size: 10px; }
  .modal-note { margin-top: 9px; color: #a19a9f; font-size: 9px; line-height: 1.55; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 13px; }
  .target-list { max-height: 165px; overflow: auto; margin-top: 6px; border: 1px solid #ece7f1; border-radius: 4px; }
  .target-option { display: block; width: 100%; padding: 6px 8px; border: 0; border-bottom: 1px solid #f2eef5; background: #fff; color: #5f5868; text-align: left; font-size: 10px; }
  .target-option:last-child { border-bottom: 0; }
  .target-option:hover { background: #f8f6fc; }
  .target-option.selected { background: #f0edff; color: #5540b4; }
  .target-option small { display: block; margin-top: 2px; color: #a39ca8; font-size: 8px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 80; padding: 7px 12px; border-radius: 4px; background: #3f3946; color: #fff; font-size: 10px; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .toast.show { opacity: 1; }
  .format-note { width: 1180px; margin: -20px auto 30px; color: #9c958d; font-size: 10px; text-align: center; }
</style>
</head>
<body>
  <div class="app">
    <div class="titlebar"><span class="filename">未分类.md</span><span class="demo-label">本地 UI 示例 · 无图标 · 文本层级</span></div>

    <div class="compact">
      <span class="compact-title">不理解词</span>
      <span class="compact-meta" id="compactStats"></span>
      <div class="compact-actions">
        <button class="btn btn-quiet" id="newFolderTop">新建文件夹</button>
        <button class="btn btn-quiet" id="newMdTop">新建 Markdown</button>
        <button class="btn btn-primary" id="toggleManager">管理</button>
      </div>
    </div>

    <section class="manager" id="manager">
      <div class="manager-head">
        <span class="manager-title">文件夹与卡片</span>
        <span class="manager-sub">文件夹只负责分类；卡片只能写入 Markdown</span>
        <input class="search" id="search" placeholder="搜索文件夹、Markdown、卡片">
        <button class="close-manager" id="closeManager">关闭</button>
      </div>
      <div class="manager-body">
        <aside class="left">
          <div class="section-head"><span class="section-title">文件夹 / Markdown</span><button class="section-add" id="newFolderInline">新建文件夹</button></div>
          <div class="tree" id="tree"></div>
          <div class="tree-note">文件夹不会自动生成 Markdown。右键可新建、重命名、删除；删除文件夹时整个分支移动到未分类。</div>
        </aside>
        <section class="right">
          <div class="breadcrumb" id="breadcrumb"></div>
          <div class="right-head">
            <span class="right-title" id="fileTitle"></span>
            <span class="right-count" id="fileCount"></span>
            <div class="right-actions">
              <button class="btn btn-primary" id="moveCard">移动卡片</button>
              <button class="btn" id="newMdHere">新建 Markdown</button>
            </div>
          </div>
          <div class="right-hint">选中卡片后点击“移动卡片”；标题层级由目标父级自动决定。</div>
          <div class="heading-tree" id="headingTree"></div>
        </section>
      </div>
      <div class="manager-foot"><span>卡片只能移动，不能在这里新建；F2 初次收录写入未分类.md 的 H1。</span><span class="foot-right" id="footStats"></span></div>
    </section>
  </div>
  <div class="format-note">交互式 UI 示例：展开/收起、右键菜单、移动卡片、新建文件夹与 Markdown 均可操作。</div>

  <div class="context-menu" id="contextMenu"></div>

  <div class="modal-layer" id="modalLayer">
    <div class="modal" id="modal">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-sub" id="modalSub"></div>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  let uid = 1;
  const nextId = () => "h" + (uid++);
  const h = (level, title, tags, content) => ({
    id: nextId(), level, title, tags: tags || [], content: content || "",
  });

  const root = {
    name: "不理解的词", type: "folder", path: "不理解的词", children: [
      { name: "未分类", type: "folder", path: "不理解的词/未分类", children: [
        { name: "未分类.md", type: "file", path: "不理解的词/未分类/未分类.md", headings: [
          h(1, "人机协作", ["#待分类"], "人与 AI 各承担一部分判断。"),
          h(1, "漫游", ["#待分类"], "不设固定目标的探索。"),
          h(1, "注意力残留", ["#认知"], "切换任务后残留的注意力。")
        ]}
      ]},
      { name: "python", type: "folder", path: "不理解的词/python", children: [
        { name: "python.md", type: "file", path: "不理解的词/python/python.md", headings: [
          h(1, "pip", ["#工具"], "Python 包管理器。"),
          h(1, "venv", ["#工具"], "虚拟环境。")
        ]},
        { name: "框架", type: "folder", path: "不理解的词/python/框架", children: [] },
        { name: "标准库", type: "folder", path: "不理解的词/python/标准库", children: [
          { name: "标准库.md", type: "file", path: "不理解的词/python/标准库/标准库.md", headings: [
            h(1, "sys", ["#模块"], "解释器相关接口。")
          ]},
          { name: "os", type: "folder", path: "不理解的词/python/标准库/os", children: [
            { name: "os.md", type: "file", path: "不理解的词/python/标准库/os/os.md", headings: [
              h(1, "os", ["#模块", "父级 / 卡片"], "Python 标准库 os 模块。"),
              h(2, "os.path", ["#路径"], "处理文件路径拼接、判断与转换。"),
              h(2, "os.environ", ["#环境变量"], "读取和修改进程环境变量。"),
              h(2, "路径操作", ["#父级"], "路径相关卡片的分组。"),
              h(3, "os.path.join", ["#路径"], "按平台规则拼接路径。")
            ]}
          ]}
        ]},
        { name: "第三方库", type: "folder", path: "不理解的词/python/第三方库", children: [] }
      ]},
      { name: "c", type: "folder", path: "不理解的词/c", children: [
        { name: "框架", type: "folder", path: "不理解的词/c/框架", children: [] },
        { name: "库", type: "folder", path: "不理解的词/c/库", children: [] }
      ]}
    ]
  };

  const state = {
    expanded: new Set(["不理解的词", "不理解的词/未分类", "不理解的词/python", "不理解的词/python/标准库", "不理解的词/python/标准库/os", "不理解的词/c"]),
    selectedFile: "不理解的词/python/标准库/os/os.md",
    selectedHeading: null,
    selectedFolder: "不理解的词",
    managerOpen: true,
    query: "",
    moveSource: null
  };

  const $ = (id) => document.getElementById(id);
  const treeEl = $("tree");
  const headingTreeEl = $("headingTree");
  const contextMenu = $("contextMenu");
  const modalLayer = $("modalLayer");
  let contextTarget = null;

  function allFiles() {
    const out = [];
    function walk(node) {
      if (node.type === "file") out.push(node);
      else (node.children || []).forEach(walk);
    }
    walk(root);
    return out;
  }
  function allFolders() {
    const out = [];
    function walk(node) {
      if (node.type === "folder") { out.push(node); (node.children || []).forEach(walk); }
    }
    walk(root);
    return out;
  }
  function findNode(path) {
    let found = null;
    function walk(node) {
      if (node.path === path) found = node;
      else if (node.type === "folder") (node.children || []).forEach(walk);
    }
    walk(root);
    return found;
  }
  function parentOf(path) {
    const parts = path.split("/");
    parts.pop();
    return findNode(parts.join("/"));
  }
  function fileCount(file) { return file && file.headings ? file.headings.length : 0; }
  function folderCount(folder) {
    if (!folder) return 0;
    if (folder.type === "file") return fileCount(folder);
    return (folder.children || []).reduce((sum, child) => sum + folderCount(child), 0);
  }
  function selectedFileNode() {
    const node = findNode(state.selectedFile);
    return node && node.type === "file" ? node : null;
  }
  function selectedHeadingNode() {
    const file = selectedFileNode();
    if (!file) return null;
    return file.headings.find((item) => item.id === state.selectedHeading) || null;
  }
  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function levelClass(level) { return "h" + Math.min(6, Math.max(1, level)); }
  function levelText(level) { return "H" + level; }
  function pathParts(path) { return path.split("/"); }

  function renderStats() {
    const files = allFiles();
    const folders = allFolders().length - 1;
    const cards = files.reduce((sum, file) => sum + fileCount(file), 0);
    $("compactStats").textContent = cards + " 条 · " + folders + " 个文件夹 · " + files.length + " 个 Markdown";
    $("footStats").textContent = cards + " 条 · " + folders + " 个文件夹 · " + files.length + " 个 Markdown";
  }

  function renderTree() {
    treeEl.innerHTML = "";
    const query = state.query.trim().toLowerCase();
    const matches = (node) => {
      if (!query) return true;
      if (node.name.toLowerCase().includes(query)) return true;
      if (node.type === "file") return (node.headings || []).some((item) => (item.title + " " + item.tags.join(" ")).toLowerCase().includes(query));
      return (node.children || []).some(matches);
    };

    function row(node, depth) {
      if (!matches(node)) return null;
      const wrap = document.createElement("div");
      const isFile = node.type === "file";
      const isSelected = isFile && node.path === state.selectedFile;
      const isFolderSelected = !isFile && node.path === state.selectedFolder;
      wrap.className = "tree-row " + (isFile ? "file" : "folder") + (isSelected ? " selected" : "") + (isFolderSelected && state.managerOpen ? " parent-selected" : "");
      wrap.style.paddingLeft = (5 + depth * 16) + "px";
      wrap.dataset.path = node.path;
      wrap.dataset.type = node.type;

      const name = document.createElement("span");
      name.className = "tree-name";
      name.textContent = node.name;
      wrap.appendChild(name);

      const count = document.createElement("span");
      count.className = "tree-count";
      count.textContent = String(folderCount(node));
      wrap.appendChild(count);

      const expanded = !isFile && (query ? true : state.expanded.has(node.path));
      if (!isFile) {
        if ((node.children || []).length) {
          const toggle = document.createElement("button");
          toggle.className = "tree-state";
          toggle.type = "button";
          toggle.textContent = expanded ? "收起" : "展开";
          toggle.addEventListener("click", (event) => {
            event.stopPropagation();
            if (expanded) state.expanded.delete(node.path);
            else state.expanded.add(node.path);
            renderTree();
          });
          wrap.appendChild(toggle);
        }
      }

      wrap.addEventListener("click", () => {
        state.selectedFolder = isFile ? (parentOf(node.path) || root).path : node.path;
        if (isFile) {
          state.selectedFile = node.path;
          state.selectedHeading = null;
        } else {
          if (state.expanded.has(node.path)) state.expanded.delete(node.path);
          else state.expanded.add(node.path);
        }
        render();
      });
      wrap.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        openContextMenu(event.clientX, event.clientY, node);
      });

      const fragment = document.createDocumentFragment();
      fragment.appendChild(wrap);
      if (!isFile && expanded) {
        for (const child of node.children || []) {
          const childRow = row(child, depth + 1);
          if (childRow) fragment.appendChild(childRow);
        }
      }
      return fragment;
    }

    const rootRow = row(root, 0);
    if (rootRow) treeEl.appendChild(rootRow);
    if (!treeEl.children.length) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "没有匹配的文件夹或 Markdown。";
      treeEl.appendChild(empty);
    }
  }

  function renderRight() {
    const file = selectedFileNode();
    const bc = $("breadcrumb");
    bc.innerHTML = "";
    if (!file) {
      bc.textContent = "请选择一个 Markdown";
      $("fileTitle").textContent = "";
      $("fileCount").textContent = "";
      headingTreeEl.innerHTML = '<div class="empty-state">从左侧选择一个 Markdown 文件。</div>';
      $("moveCard").disabled = true;
      return;
    }
    const parts = pathParts(file.path);
    parts.forEach((part, index) => {
      const span = document.createElement("span");
      if (index === parts.length - 1) {
        const b = document.createElement("b"); b.textContent = part; span.appendChild(b);
      } else {
        span.textContent = part;
      }
      bc.appendChild(span);
      if (index < parts.length - 1) {
        const sep = document.createElement("span"); sep.textContent = "/"; sep.className = "sep"; bc.appendChild(sep);
      }
    });
    $("fileTitle").textContent = file.name;
    $("fileCount").textContent = fileCount(file) + " 个卡片";
    $("moveCard").disabled = !selectedHeadingNode();
    headingTreeEl.innerHTML = "";

    const query = state.query.trim().toLowerCase();
    const headings = file.headings.filter((item) => !query || (item.title + " " + item.tags.join(" ")).toLowerCase().includes(query));
    if (!headings.length) {
      headingTreeEl.innerHTML = '<div class="empty-state">没有匹配的卡片。</div>';
      return;
    }
    for (const heading of headings) {
      const row = document.createElement("div");
      row.className = "heading-row" + (heading.id === state.selectedHeading ? " selected" : "");
      row.style.marginLeft = ((heading.level - 1) * 18) + "px";
      row.dataset.id = heading.id;
      const level = document.createElement("span");
      level.className = "level " + levelClass(heading.level);
      level.textContent = levelText(heading.level);
      row.appendChild(level);
      const main = document.createElement("div");
      main.className = "heading-main";
      const line = document.createElement("div");
      line.className = "heading-line";
      const title = document.createElement("span");
      title.className = "heading-title";
      title.textContent = heading.title;
      line.appendChild(title);
      for (const tag of heading.tags || []) {
        const tagEl = document.createElement("span");
        tagEl.className = "tag";
        tagEl.textContent = tag;
        line.appendChild(tagEl);
      }
      main.appendChild(line);
      if (heading.content) {
        const snippet = document.createElement("div");
        snippet.className = "heading-snippet";
        snippet.textContent = heading.content;
        main.appendChild(snippet);
      }
      row.appendChild(main);
      row.addEventListener("click", () => {
        state.selectedHeading = heading.id;
        renderRight();
      });
      row.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        state.selectedHeading = heading.id;
        renderRight();
        openContextMenu(event.clientX, event.clientY, heading, file);
      });
      headingTreeEl.appendChild(row);
    }
  }

  function render() {
    renderStats();
    renderTree();
    renderRight();
    $("manager").hidden = !state.managerOpen;
    $("toggleManager").textContent = state.managerOpen ? "收起" : "管理";
  }

  function openContextMenu(x, y, node, file) {
    contextTarget = { node, file: file || null };
    contextMenu.innerHTML = "";
    const add = (label, handler, danger) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      if (danger) button.className = "danger";
      button.addEventListener("click", () => { closeContextMenu(); handler(); });
      contextMenu.appendChild(button);
    };
    if (node.type === "folder") {
      add("新建 Markdown", () => openNewMdModal(node));
      add("新建子文件夹", () => openNewFolderModal(node));
      if (node.path !== root.path) {
        add("重命名文件夹", () => openRenameModal(node));
        add("删除文件夹（移至未分类）", () => openDeleteFolderModal(node), true);
      }
    } else if (node.type === "file") {
      add("打开", () => { state.selectedFile = node.path; state.selectedFolder = (parentOf(node.path) || root).path; render(); });
      add("重命名 Markdown", () => openRenameModal(node));
    } else {
      add("移动卡片", () => openMoveModal(node, file));
      add("取消选择", () => { state.selectedHeading = null; renderRight(); });
    }
    contextMenu.style.display = "block";
    const rect = contextMenu.getBoundingClientRect();
    contextMenu.style.left = Math.min(x, window.innerWidth - rect.width - 8) + "px";
    contextMenu.style.top = Math.min(y, window.innerHeight - rect.height - 8) + "px";
  }
  function closeContextMenu() { contextMenu.style.display = "none"; contextTarget = null; }
  document.addEventListener("click", (event) => {
    if (!contextMenu.contains(event.target)) closeContextMenu();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") { closeContextMenu(); closeModal(); }
  });

  function openModal(title, sub, bodyHtml, actions) {
    $("modalTitle").textContent = title;
    $("modalSub").textContent = sub || "";
    $("modalBody").innerHTML = bodyHtml || "";
    const actionsEl = $("modalActions");
    actionsEl.innerHTML = "";
    for (const action of actions) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "btn" + (action.primary ? " btn-primary" : "");
      button.textContent = action.label;
      button.addEventListener("click", action.handler);
      actionsEl.appendChild(button);
    }
    modalLayer.classList.add("open");
    const firstInput = $("modalBody").querySelector("input,select");
    if (firstInput) window.setTimeout(() => firstInput.focus(), 0);
  }
  function closeModal() { modalLayer.classList.remove("open"); }
  function toast(message) {
    const el = $("toast");
    el.textContent = message;
    el.classList.add("show");
    window.clearTimeout(toast.timer);
    toast.timer = window.setTimeout(() => el.classList.remove("show"), 1800);
  }

  function openNewFolderModal(parent) {
    const target = parent || findNode(state.selectedFolder) || root;
    openModal("新建文件夹",
      "文件夹只负责分类，不会自动生成 Markdown。",
      '<div class="path-box">所在位置：' + escapeHtml(target.path) + '</div>' +
      '<div class="field"><label>文件夹名</label><input id="modalInput" placeholder="例如：框架"></div>',
      [
        { label: "取消", handler: closeModal },
        { label: "创建", primary: true, handler: () => {
          const value = $("modalInput").value.trim();
          if (!value) return toast("请输入文件夹名");
          if (value.includes("/") || value.includes("\\")) return toast("文件夹名不能包含斜杠");
          const path = target.path + "/" + value;
          if (findNode(path)) return toast("同名文件夹已存在");
          target.children = target.children || [];
          target.children.push({ name: value, type: "folder", path, children: [] });
          state.expanded.add(target.path);
          state.selectedFolder = path;
          closeModal(); render();
        }}
      ]);
  }
  function openNewMdModal(folder) {
    const target = folder || findNode(state.selectedFolder) || root;
    if (target.type !== "folder") return openNewMdModal(parentOf(target.path));
    openModal("新建 Markdown",
      "Markdown 由管理界面手动创建，文件夹不会自动生成。",
      '<div class="path-box">所在文件夹：' + escapeHtml(target.path) + '</div>' +
      '<div class="field"><label>文件名</label><input id="modalInput" value="' + escapeHtml(target.name === "不理解的词" ? "未分类.md" : "新文件.md") + '"></div>',
      [
        { label: "取消", handler: closeModal },
        { label: "创建", primary: true, handler: () => {
          let value = $("modalInput").value.trim();
          if (!value) return toast("请输入文件名");
          if (!value.endsWith(".md")) value += ".md";
          if (/[\\/]/.test(value)) return toast("文件名不能包含斜杠");
          const path = target.path + "/" + value;
          if (findNode(path)) return toast("同名 Markdown 已存在");
          target.children = target.children || [];
          target.children.push({ name: value, type: "file", path, headings: [] });
          state.expanded.add(target.path);
          state.selectedFile = path;
          state.selectedFolder = target.path;
          state.selectedHeading = null;
          closeModal(); render();
        }}
      ]);
  }
  function openRenameModal(node) {
    openModal("重命名",
      "只修改名称，内容不变。",
      '<div class="path-box">' + escapeHtml(node.path) + '</div>' +
      '<div class="field"><label>新名称</label><input id="modalInput" value="' + escapeHtml(node.name) + '"></div>',
      [
        { label: "取消", handler: closeModal },
        { label: "保存", primary: true, handler: () => {
          const value = $("modalInput").value.trim();
          if (!value) return toast("名称不能为空");
          if (value.includes("/") || value.includes("\\")) return toast("名称不能包含斜杠");
          const oldName = node.name;
          node.name = node.type === "file" && !value.endsWith(".md") ? value + ".md" : value;
          const oldPath = node.path;
          const parent = parentOf(oldPath);
          if (parent) {
            node.path = parent.path + "/" + node.name;
            if (node.type === "folder") rebasePaths(node);
            if (state.selectedFile === oldPath) state.selectedFile = node.path;
          }
          closeModal(); render();
        }}
      ]);
  }
  function rebasePaths(node) {
    for (const child of node.children || []) {
      child.path = node.path + "/" + child.name;
      if (child.type === "folder") rebasePaths(child);
    }
  }
  function openDeleteFolderModal(node) {
    if (node.path === root.path || node.name === "未分类") {
      toast("根目录和未分类不能删除");
      return;
    }
    openModal("删除文件夹",
      "整个分支会移动到未分类，不删除任何 Markdown 或卡片内容。",
      '<div class="path-box">' + escapeHtml(node.path) + '</div>' +
      '<div class="modal-note">目标：不理解的词 / 未分类 / ' + escapeHtml(node.name) + '</div>',
      [
        { label: "取消", handler: closeModal },
        { label: "移动并删除", primary: true, handler: () => {
          const parent = parentOf(node.path);
          const unclassified = findNode("不理解的词/未分类");
          if (!parent || !unclassified) return toast("未分类文件夹不存在");
          parent.children = parent.children.filter((child) => child !== node);
          let targetName = node.name;
          let targetPath = unclassified.path + "/" + targetName;
          let suffix = 2;
          while (findNode(targetPath)) { targetName = node.name + "-" + suffix; targetPath = unclassified.path + "/" + targetName; suffix += 1; }
          node.name = targetName;
          node.path = targetPath;
          if (node.type === "folder") rebasePaths(node);
          unclassified.children = unclassified.children || [];
          unclassified.children.push(node);
          state.expanded.add(unclassified.path);
          closeModal(); render();
          toast("已移动到未分类，内容未删除");
        }}
      ]);
  }

  function subtree(file, index) {
    const source = file.headings[index];
    let end = index + 1;
    while (end < file.headings.length && file.headings[end].level > source.level) end += 1;
    return file.headings.slice(index, end);
  }
  function openMoveModal(heading, file) {
    if (!heading || !file) return toast("请先选择卡片");
    state.moveSource = { file, heading };
    openModal("移动卡片",
      "只能移动已有卡片；选择目标 Markdown 与父级后自动重算标题级别。",
      '<div class="modal-sub" style="margin-bottom:5px">源卡片：' + escapeHtml(file.path) + ' · ' + escapeHtml(heading.title) + '（H' + heading.level + '）</div>' +
      '<div class="field"><label>搜索目标</label><input id="moveSearch" placeholder="搜索文件夹、Markdown、父级"></div>' +
      '<div class="field"><label>目标位置</label><select id="moveTarget"></select></div>' +
      '<div class="target-list" id="moveList"></div>' +
      '<div class="field"><label>移动后级别</label><span class="level-preview" id="movePreview"></span></div>' +
      '<div class="modal-note">父级可为 Markdown、H1–H5；H6 不能继续作为父级。卡片标题和内容会一起移动。</div>',
      [
        { label: "取消", handler: closeModal },
        { label: "移动卡片", primary: true, handler: executeMove }
      ]);

    const options = buildMoveOptions(file, heading);
    const select = $("moveTarget");
    const list = $("moveList");
    const preview = $("movePreview");
    const search = $("moveSearch");
    function paint(filter) {
      const query = (filter || "").trim().toLowerCase();
      select.innerHTML = "";
      list.innerHTML = "";
      const filtered = options.filter((option) => !query || option.label.toLowerCase().includes(query));
      if (!filtered.length) {
        list.innerHTML = '<div class="empty-state" style="padding:15px">没有匹配的目标。</div>';
        preview.textContent = "请选择目标位置";
        return;
      }
      filtered.forEach((option, index) => {
        const selectOption = document.createElement("option");
        selectOption.value = option.key;
        selectOption.textContent = option.label;
        select.appendChild(selectOption);
        const el = document.createElement("button");
        el.type = "button";
        el.className = "target-option" + (index === 0 ? " selected" : "");
        el.textContent = option.label;
        el.dataset.key = option.key;
        if (option.detail) {
          const small = document.createElement("small");
          small.textContent = option.detail;
          el.appendChild(small);
        }
        el.addEventListener("click", () => {
          list.querySelectorAll(".target-option").forEach((item) => item.classList.remove("selected"));
          el.classList.add("selected");
          select.value = option.key;
          updatePreview(option);
        });
        list.appendChild(el);
        if (index === 0) { select.value = option.key; updatePreview(option); }
      });
    }
    function updatePreview(option) {
      preview.innerHTML = "父级 " + (option.parentLevel ? "H" + option.parentLevel : "Markdown") + "，卡片 <b>H" + option.level + "</b>";
    }
    search.addEventListener("input", () => paint(search.value));
    paint("");
  }
  function isDescendantOf(file, sourceIndex, targetIndex) {
    if (targetIndex <= sourceIndex) return false;
    const sourceLevel = file.headings[sourceIndex].level;
    for (let i = sourceIndex + 1; i <= targetIndex; i += 1) {
      if (file.headings[i].level <= sourceLevel) return false;
    }
    return true;
  }
  function buildMoveOptions(sourceFile, sourceHeading) {
    const options = [];
    const sourceIndex = sourceFile.headings.indexOf(sourceHeading);
    const sourceSub = subtree(sourceFile, sourceIndex);
    for (const file of allFiles()) {
      const isSame = file.path === sourceFile.path;
      options.push({ key: file.path + "::md", label: file.path + " · Markdown", detail: "父级：Markdown 文件，卡片 H1", file, parent: null, parentLevel: 0, level: 1 });
      file.headings.forEach((heading, index) => {
        if (heading.level >= 6) return;
        if (isSame && heading === sourceHeading) return;
        options.push({
          key: file.path + "::" + heading.id,
          label: file.path + " · H" + heading.level + " " + heading.title,
          detail: "父级：H" + heading.level + " " + heading.title + "，卡片 H" + (heading.level + 1),
          file, parent: heading, parentLevel: heading.level, level: heading.level + 1
        });
      });
    }
    return options;
  }
  function executeMove() {
    if (!state.moveSource) return;
    const key = $("moveTarget").value;
    if (!key) return toast("请选择目标位置");
    const options = buildMoveOptions(state.moveSource.file, state.moveSource.heading);
    const option = options.find((item) => item.key === key);
    if (!option) return toast("目标位置无效");
    const sourceFile = state.moveSource.file;
    const sourceHeading = state.moveSource.heading;
    const sourceIndex = sourceFile.headings.indexOf(sourceHeading);
    const moving = subtree(sourceFile, sourceIndex);
    const maxLevel = Math.max.apply(null, moving.map((item) => item.level));
    const delta = option.level - sourceHeading.level;
    if (maxLevel + delta > 6) return toast("移动后超过 H6，不能继续嵌套");
    const targetFile = option.file;
    const targetTitles = new Set(targetFile.headings.filter((item) => !moving.includes(item)).map((item) => item.title));
    const duplicate = moving.find((item) => targetTitles.has(item.title));
    if (duplicate) return toast('目标 Markdown 中已有同名标题“' + duplicate.title + '”');
    if (targetFile === sourceFile && option.parent && moving.includes(option.parent)) return toast("不能移动到自己的子级");

    sourceFile.headings.splice(sourceIndex, moving.length);
    const adjusted = moving.map((item) => Object.assign({}, item, { level: item.level + delta }));
    if (targetFile === sourceFile) {
      const parentIndex = option.parent ? targetFile.headings.indexOf(option.parent) : -1;
      const insertAt = option.parent ? endOfSubtree(targetFile, parentIndex) : targetFile.headings.length;
      targetFile.headings.splice(insertAt, 0, ...adjusted);
    } else {
      const parentIndex = option.parent ? targetFile.headings.indexOf(option.parent) : -1;
      const insertAt = option.parent ? endOfSubtree(targetFile, parentIndex) : targetFile.headings.length;
      targetFile.headings.splice(insertAt, 0, ...adjusted);
    }
    state.selectedFile = targetFile.path;
    state.selectedFolder = (parentOf(targetFile.path) || root).path;
    state.selectedHeading = adjusted[0].id;
    state.expanded.add(state.selectedFolder);
    closeModal(); render();
    toast("卡片已移动，标题级别已重算");
  }
  function endOfSubtree(file, index) {
    if (index < 0) return file.headings.length;
    const level = file.headings[index].level;
    let end = index + 1;
    while (end < file.headings.length && file.headings[end].level > level) end += 1;
    return end;
  }

  // wire top buttons
  $("toggleManager").addEventListener("click", () => { state.managerOpen = !state.managerOpen; render(); });
  $("closeManager").addEventListener("click", () => { state.managerOpen = false; render(); });
  $("newFolderTop").addEventListener("click", () => openNewFolderModal(findNode(state.selectedFolder) || root));
  $("newFolderInline").addEventListener("click", () => openNewFolderModal(findNode(state.selectedFolder) || root));
  $("newMdTop").addEventListener("click", () => openNewMdModal(findNode(state.selectedFolder) || root));
  $("newMdHere").addEventListener("click", () => {
    const file = selectedFileNode();
    openNewMdModal(file ? parentOf(file.path) : findNode(state.selectedFolder) || root);
  });
  $("moveCard").addEventListener("click", () => {
    const file = selectedFileNode();
    const heading = selectedHeadingNode();
    if (!file || !heading) return toast("请先选择一张卡片");
    openMoveModal(heading, file);
  });
  $("search").addEventListener("input", (event) => { state.query = event.target.value; render(); });
  modalLayer.addEventListener("click", (event) => { if (event.target === modalLayer) closeModal(); });

  // defaults
  const initial = selectedFileNode();
  if (initial && initial.headings.length) {
    const preferred = initial.headings.find((item) => item.title === "os.path") || initial.headings[0];
    state.selectedHeading = preferred.id;
  }
  render();
})();
</script>
</body>
</html>
